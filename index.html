<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: romix-cover:; media-src 'self' blob: romix-audio:; connect-src 'self' romix-audio: ws://localhost:1420; object-src 'none'; base-uri 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/romix.svg" />
    <title>Romix</title>
    <script>
      // Apply the saved theme before first paint so there's no flash. Dark is the default.
      (function () {
        var pref = "dark";
        try { pref = localStorage.getItem("romix.theme") || "dark"; } catch (e) {}
        var light = pref === "light" || (pref === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
